spring.application.name=usersapp

# conexión base de datos Oracle 21
# Usa el servicio de la base, no SID
# Si tu servicio es XEPDB1, deja esta URL:
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xepdb1
# Si tu instancia es XE, usa esta en lugar de la anterior:
# spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.username=USERSDB
spring.datasource.password=1234
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# configuración JPA
# Spring Boot 4 / Hibernate 7 usa OracleDialect, no Oracle12cDialect
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none